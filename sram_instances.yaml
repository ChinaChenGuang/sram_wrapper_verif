# ============================================================
# SRAM B2B 实例配置
# ============================================================
#
# 文件层次:
#   exp1_mem_wrap.v    ← 顶层 wrapper (解析 RUNIOBIT, NUMWORD)
#     └─ exp1_low_mem_wrap.v       ← 在 mem_lib filelist 里
#          └─ mem_lib/*.v          ← 在 mem_lib filelist 里
#
# 你只需提供:
#   parse_from    → 顶层 _mem_wrap.v (自动提取位宽参数)
#   orig_path     → orig 顶层 wrapper
#   orig_filelist → orig mem_lib filelist (含 sub_wrapper + 所有 mem)
#   new_path      → new 顶层 wrapper
#   new_filelist  → new mem_lib filelist
# ============================================================

instances:

  - name: exp1_mem_wrap
    parse_from: orig/exp1_mem_wrap.v         # 解析 RUNIOBIT, NUMWORD
    orig_path:  orig/exp1_mem_wrap.v         # orig 顶层
    orig_filelist: orig/mem_lib/files.f      # sub_wrapper + mem 都在这里
    new_path:   new/exp1_mem_wrap.v          # new 顶层
    new_filelist: new/mem_lib/files.f        # new sub_wrapper + mem
    enabled: true

  # - name: exp2_mem_wrap
  #   parse_from: orig/exp2_mem_wrap.v
  #   orig_path:  orig/exp2_mem_wrap.v
  #   orig_filelist: orig/mem_lib/exp2_files.f
  #   new_path:   new/exp2_mem_wrap.v
  #   new_filelist: new/mem_lib/exp2_files.f
  #   enabled: true

global:
  output_dir: gen
  ori_suffix: _ori
  new_suffix: _new
